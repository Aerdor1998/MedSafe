# Configuração do Prometheus para MedSafe

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'medsafe'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # MedSafe API
  - job_name: 'medsafe-api'
    metrics_path: '/metrics'
    static_configs:
      # API exposes Prometheus metrics at /metrics on the main HTTP port
      - targets: ['api:9000']
        labels:
          service: 'api'
          env: 'production'

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'database'

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'cache'

  # Node Exporter (se houver)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'system'

  # Ollama (host nativo) via blackbox exporter.
  # Ollama não fala Prometheus; o blackbox faz probe HTTP e publica probe_success.
  - job_name: 'ollama'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://host.docker.internal:11434/api/tags']
        labels:
          service: 'llm'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115


