# Prometheus Configuration for MedSafe
# SKILL: @prometheus-configuration - Production-grade metrics collection

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'medsafe-production'
    environment: 'prod'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - 'alerts/*.yml'

# Scrape configurations
scrape_configs:
  # MedSafe API
  - job_name: 'medsafe-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['medsafe_api:9000']
        labels:
          service: 'api'
          component: 'backend'

  # PostgreSQL with pgvector
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'database'
          component: 'postgres'

  # Ollama LLM Service
  - job_name: 'ollama'
    static_configs:
      - targets: ['medsafe_ollama:11434']
        labels:
          service: 'llm'
          component: 'ollama'

  # Node Exporter (System metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'infrastructure'
          component: 'node'

  # Docker containers
  - job_name: 'docker'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'infrastructure'
          component: 'docker'

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'monitoring'
          component: 'prometheus'
