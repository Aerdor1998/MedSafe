name: MedSafe CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  POSTGRES_USER: medsafe
  POSTGRES_PASSWORD: test_password_ci
  POSTGRES_DB: medsafe_test
  SECRET_KEY: "test-ci-secret-key-minimum-32-chars"
  JWT_SECRET: "test-ci-jwt-secret-minimum-32-chars"

jobs:
  # =================================================================
  # JOB 1: Linting e Code Quality
  # =================================================================
  lint:
    name: 🔍 Lint & Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      
      - name: 📦 Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lint.txt
      
      - name: 🎨 Check code formatting with Black
        run: black --check --diff backend/
        continue-on-error: false
      
      - name: 📝 Check import sorting with isort
        run: isort --check-only --diff --profile black backend/
        continue-on-error: false
      
      - name: 🔍 Run Flake8 linting
        run: flake8 backend/ --max-line-length=120 --extend-ignore=E203,W503
        continue-on-error: false
      
      - name: 🔒 Run Bandit security scan
        run: |
          pip install bandit
          bandit -r backend/app/ -ll -ii --exclude "**/tests/**"
        continue-on-error: true

  # =================================================================
  # JOB 2: Type Checking
  # =================================================================
  type-check:
    name: 📊 Type Checking
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install mypy types-redis types-python-dateutil
      
      - name: 🔍 Run MyPy type checking
        run: mypy backend/app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

  # =================================================================
  # JOB 3: Unit Tests
  # =================================================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-test.txt
      
      - name: 🧪 Run unit tests
        env:
          TESTING: "true"
          DEBUG: "true"
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ${{ env.SECRET_KEY }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
        run: |
          pytest backend/tests/ \
            --ignore=backend/tests/e2e/ \
            -v \
            --tb=short \
            --cov=backend/app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60
      
      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests
          name: medsafe-coverage
          fail_ci_if_error: false

  # =================================================================
  # JOB 4: Integration Tests
  # =================================================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-test.txt
      
      - name: 🔗 Run integration tests
        env:
          TESTING: "true"
          DEBUG: "true"
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ${{ env.SECRET_KEY }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
        run: |
          pytest backend/tests/ \
            -k "integration" \
            -v \
            --tb=short

  # =================================================================
  # JOB 5: Security Scan
  # =================================================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: [lint]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      
      - name: 📦 Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit pip-audit
      
      - name: 🔍 Check dependencies for vulnerabilities (Safety)
        run: safety check -r requirements.txt --output json
        continue-on-error: true
      
      - name: 🔍 Check dependencies for vulnerabilities (pip-audit)
        run: pip-audit -r requirements.lock
      
      - name: 🔒 Run Bandit security analysis
        run: |
          bandit -r backend/app/ \
            -ll \
            -ii \
            --exclude "**/tests/**" \
            -f json \
            -o bandit-report.json
      
      - name: 📤 Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
          retention-days: 30

  # =================================================================
  # JOB 6: Docker Build Test
  # =================================================================
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [unit-tests]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🏗️ Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true  # exporta para o daemon local; sem isso o Trivy não encontra medsafe:test
          tags: medsafe:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Imagem oficial do Trivy (evita o install.sh do trivy-action, que falha
      # ao baixar o binário do GitHub Releases dentro do runner)
      - name: 🔍 Scan Docker image for vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.65.0 image \
              --format table --exit-code 1 --severity CRITICAL,HIGH \
              --ignore-unfixed medsafe:test

  # =================================================================
  # JOB 7: E2E Tests (só em push para main)
  # =================================================================
  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: [integration-tests, docker-build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: staging
    timeout-minutes: 45
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: tests/e2e/playwright/pnpm-lock.yaml

      - name: 📦 Install browser test dependencies
        working-directory: tests/e2e/playwright
        run: pnpm install --frozen-lockfile

      - name: 🌐 Install Chromium
        working-directory: tests/e2e/playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: 🎭 Run blocking Playwright suite against staging
        working-directory: tests/e2e/playwright
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          test -n "$E2E_BASE_URL" -a -n "$E2E_EMAIL" -a -n "$E2E_PASSWORD"
          pnpm test

      - name: 📤 Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: tests/e2e/playwright/shots/
          if-no-files-found: ignore
          retention-days: 14

  # =================================================================
  # JOB 8: Summary
  # =================================================================
  ci-summary:
    name: 📋 CI Summary
    runs-on: ubuntu-latest
    needs: [lint, type-check, unit-tests, integration-tests, security-scan, docker-build, e2e-tests]
    if: always()
    
    steps:
      - name: 📋 Generate summary
        run: |
          echo "## 🔬 MedSafe CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📊 Type Check | ${{ needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔗 Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎭 E2E Playwright | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
