# Synthetic staging on a dedicated host. Use with docker-compose.prod.yml.
services:
  staging-ollama:
    image: ollama/ollama:0.32.5
    environment:
      OLLAMA_CONTEXT_LENGTH: "4096"
    networks: [medsafe_network]
  migrate:
    image: medsafe-staging:candidate
  api:
    image: medsafe-staging:candidate
    environment:
      OLLAMA_HOST: http://staging-ollama:11434
  worker:
    image: medsafe-staging:candidate
    environment:
      OLLAMA_HOST: http://staging-ollama:11434
