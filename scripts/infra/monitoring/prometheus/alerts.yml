# MedSafe Prometheus Alerting Rules
# 
# This file defines critical alerts for production monitoring.
# Import into Prometheus via prometheus.yml:
#   rule_files:
#     - "alerts.yml"

groups:
  # ============================================================================
  # API Health & Availability
  # ============================================================================
  - name: medsafe_api_health
    rules:
      - alert: MedSafeAPIDown
        expr: up{job="medsafe-api"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "MedSafe API is down"
          description: "MedSafe API instance {{ $labels.instance }} has been down for more than 1 minute."
          runbook_url: "https://docs.medsafe.local/runbooks/api-down"

      - alert: MedSafeAPIHighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="medsafe-api"}[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "MedSafe API high latency"
          description: "95th percentile latency is above 2 seconds for the last 5 minutes."

      - alert: MedSafeAPIHighErrorRate
        expr: sum(rate(http_request_total{job="medsafe-api", status=~"5.."}[5m])) / sum(rate(http_request_total{job="medsafe-api"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "MedSafe API high error rate"
          description: "More than 5% of requests are returning 5xx errors."

  # ============================================================================
  # Worker Health
  # ============================================================================
  - name: medsafe_worker_health
    rules:
      - alert: MedSafeWorkerDown
        expr: up{job="medsafe-worker"} == 0
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "MedSafe Worker is down"
          description: "Analysis worker has been down for more than 2 minutes. Jobs will not be processed."

      - alert: MedSafeWorkerJobBacklog
        expr: medsafe_analysis_jobs_pending > 50
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Analysis job backlog growing"
          description: "More than 50 pending analysis jobs for 10+ minutes. Consider scaling workers."

      - alert: MedSafeWorkerJobStuck
        expr: medsafe_analysis_jobs_running > 0 and changes(medsafe_analysis_jobs_completed_total[30m]) == 0
        for: 30m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Analysis jobs appear stuck"
          description: "Jobs are running but no completions in 30 minutes. Possible worker deadlock."

  # ============================================================================
  # HITL Queue (Human-in-the-Loop)
  # ============================================================================
  - name: medsafe_hitl_alerts
    rules:
      - alert: MedSafeHITLQueueGrowing
        expr: medsafe_hitl_pending_reviews > 10
        for: 30m
        labels:
          severity: warning
          team: clinical
        annotations:
          summary: "HITL review queue is growing"
          description: "More than 10 analyses awaiting human review for 30+ minutes."

      - alert: MedSafeHITLQueueCritical
        expr: medsafe_hitl_pending_reviews > 25
        for: 15m
        labels:
          severity: critical
          team: clinical
        annotations:
          summary: "HITL review queue critically high"
          description: "More than 25 analyses awaiting human review. Patient care may be delayed."

  # ============================================================================
  # LLM/Ollama Health
  # ============================================================================
  - name: medsafe_llm_health
    rules:
      - alert: MedSafeOllamaDown
        expr: up{job="ollama"} == 0
        for: 2m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Ollama LLM service is down"
          description: "Ollama service has been unreachable for 2 minutes. Analysis will fail."

      - alert: MedSafeLLMHighLatency
        expr: histogram_quantile(0.95, sum(rate(medsafe_llm_call_duration_seconds_bucket[5m])) by (le)) > 30
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "LLM calls are slow"
          description: "95th percentile LLM latency is above 30 seconds. Check GPU utilization."

      - alert: MedSafeLLMHighErrorRate
        expr: sum(rate(medsafe_llm_call_errors_total[5m])) / sum(rate(medsafe_llm_call_total[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "LLM error rate high"
          description: "More than 10% of LLM calls are failing."

  # ============================================================================
  # Database Health
  # ============================================================================
  - name: medsafe_database_health
    rules:
      - alert: MedSafeDBConnectionPoolExhausted
        expr: medsafe_db_pool_active / medsafe_db_pool_size > 0.9
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "More than 90% of DB connections in use. May cause request failures."

      - alert: MedSafeDBDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "PostgreSQL database is down"
          description: "Database unreachable for more than 1 minute."

  # ============================================================================
  # Security Alerts
  # ============================================================================
  - name: medsafe_security_alerts
    rules:
      - alert: MedSafeHighRateLimitHits
        expr: sum(rate(medsafe_rate_limit_exceeded_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "High rate limit hit rate"
          description: "Many requests hitting rate limits. Possible abuse or DDoS attempt."

      - alert: MedSafeAuthFailuresSpike
        expr: sum(rate(medsafe_auth_failures_total[5m])) > 20
        for: 5m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Authentication failure spike"
          description: "High rate of authentication failures. Possible credential stuffing attack."

  # ============================================================================
  # Infrastructure
  # ============================================================================
  - name: medsafe_infrastructure
    rules:
      - alert: MedSafeHighCPU
        expr: avg(rate(process_cpu_seconds_total{job="medsafe-api"}[5m])) > 0.8
        for: 10m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "High CPU usage on API"
          description: "API process using more than 80% CPU for 10+ minutes."

      - alert: MedSafeHighMemory
        expr: process_resident_memory_bytes{job="medsafe-api"} / 1024 / 1024 / 1024 > 4
        for: 10m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "High memory usage on API"
          description: "API process using more than 4GB RAM. Possible memory leak."

      - alert: MedSafeRedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Redis is down"
          description: "Redis service unreachable. Rate limiting and caching will fail."

