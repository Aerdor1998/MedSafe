  aspirin: [asa, acetylsalicylic acid, aas]
  ibuprofen: [advil, motrin, brufen]
  acetaminophen: [paracetamol, tylenol]
  naproxen: [naprosyn, aleve]

  # Cardiovascular
  warfarin: [coumadin, marevan]
  losartan: [cozaar]
  lisinopril: [zestril, prinivil]
  metoprolol: [lopressor, toprol]
  amlodipine: [norvasc]
  atorvastatin: [lipitor]
  simvastatin: [zocor]

  # Diabetes
  metformin: [glucophage, glifage]
  glibenclamide: [glyburide, daonil]

  # Antibiotics
  amoxicillin: [amoxil]
  ciprofloxacin: [cipro]
  azithromycin: [zithromax]

  # Psychiatric
  sertraline: [zoloft]
  fluoxetine: [prozac]
  escitalopram: [lexapro]
  diazepam: [valium]
  alprazolam: [xanax]

  # Antacids/GI
  omeprazole: [prilosec, losec]
  pantoprazole: [protonix]
  ranitidine: [zantac]

# ============================================================================
# RECOMMENDATION TEMPLATES
# ============================================================================
recommendation_templates:
  critical:
    header: "CRITICAL ALERT - IMMEDIATE ACTION REQUIRED"
    actions:
      - "DO NOT ADMINISTER without in-person medical evaluation"
      - "Evaluate therapeutic alternatives immediately"
      - "If already in use, consider supervised discontinuation"
    monitoring:
      - "Vital signs every 4 hours"
      - "ECG if indicated"
      - "Laboratory tests per specific drug"

  high:
    header: "HIGH ALERT - MEDICAL REVIEW RECOMMENDED"
    actions:
      - "Evaluate risk-benefit before prescribing"
      - "Consider dose adjustment or alternative"
      - "Document justification if maintaining prescription"
    monitoring:
      - "Weekly clinical monitoring initially"
      - "Baseline labs and 2-week follow-up"

  medium:
    header: "CAUTION - CARE REQUIRED"
    actions:
      - "May be prescribed with precautions"
      - "Inform patient about warning signs"
    monitoring:
      - "Re-evaluation at follow-up visit"

  low:
    header: "LOW RISK INTERACTION"
    actions:
      - "May be prescribed normally"
    monitoring:
      - "Routine follow-up"

# ============================================================================
# CATEGORY-SPECIFIC RECOMMENDATIONS
# ============================================================================
category_recommendations:
  Cardiovascular:
    monitoring: [ECG baseline and serial, Monitor QTc, Daily BP and HR]
    labs: [Electrolytes (K, Mg), Renal function]
    alerts: [Palpitations, Dizziness, Syncope]

  Coagulation:
    monitoring: [Weekly INR initially, Signs of bleeding]
    labs: [CBC, PT/INR, Platelets]
    alerts: [Gum bleeding, Bruising, Melena, Hematuria]

  Renal:
    monitoring: [Urine output, Daily weight]
    labs: [Creatinine, BUN, Electrolytes]
    alerts: [Oliguria, Edema, Nausea]

  Hepatic:
    monitoring: [Signs of jaundice, Hepatomegaly]
    labs: [AST/ALT, Bilirubin, ALP, GGT]
    alerts: [Jaundice, RUQ pain, Pruritus]

  Neurological:
    monitoring: [Level of consciousness, Reflexes]
    labs: [Drug levels if available]
    alerts: [Confusion, Tremors, Seizures, Excessive sedation]
