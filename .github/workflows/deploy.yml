name: Smoke Test (pós-deploy)

# CONTEXTO — por que este workflow não faz deploy:
#
# O caminho de entrega real do MedSafe é: stack local via docker-compose.prod.yml,
# exposta por Cloudflare Tunnel, com o frontend estático no Vercel. O GitHub Actions
# não tem como alcançar essa máquina — não há host SSH para onde fazer deploy.
#
# A versão anterior deste arquivo fingia: marcava environments do GitHub como
# "deployed" em URLs inexistentes (staging.medsafe.example.com) e imprimia
# "Smoke tests passed" sem nunca fazer uma requisição. Um deploy quebrado aparecia
# verde. Isso foi removido.
#
# O que sobrou é honesto: uma verificação de verdade, rodada sob demanda contra a URL
# pública real, que FALHA quando a aplicação está fora do ar.
#
# Para habilitar, defina a variável de repositório MEDSAFE_PUBLIC_URL
# (Settings → Secrets and variables → Actions → Variables), ex.: https://api.seudominio.com
#
# Sem a variável, a execução AGENDADA é pulada (não há o que verificar — falhar
# todo dia às 09:07 por "não configurado" só ensina a ignorar o CI). A execução
# manual sempre roda e falha alto se nenhuma URL for informada.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL base a verificar (sobrepõe a variável MEDSAFE_PUBLIC_URL)'
        required: false
        type: string
  schedule:
    # Diário às 09:07 UTC — minuto fora do :00 de propósito
    - cron: '7 9 * * *'

jobs:
  smoke:
    name: Verifica saúde da produção
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.MEDSAFE_PUBLIC_URL != ''
    steps:
      - name: Resolve URL alvo
        id: target
        run: |
          URL="${{ inputs.target_url || vars.MEDSAFE_PUBLIC_URL }}"
          if [ -z "$URL" ]; then
            echo "::error::Nenhuma URL configurada. Defina a variável de repositório MEDSAFE_PUBLIC_URL ou passe target_url."
            exit 1
          fi
          echo "url=${URL%/}" >> "$GITHUB_OUTPUT"
          echo "Alvo: ${URL%/}"

      - name: /healthz responde e não está unhealthy
        run: |
          URL="${{ steps.target.outputs.url }}"
          BODY=$(curl -fsS --max-time 20 "$URL/healthz")
          echo "$BODY"
          STATUS=$(echo "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
          echo "status=$STATUS"
          case "$STATUS" in
            healthy)  echo "OK: todas as dependências no ar" ;;
            degraded) echo "::warning::Aplicação DEGRADADA (provável Ollama fora) — analisa não completa" ;;
            *)        echo "::error::status inesperado: '$STATUS'"; exit 1 ;;
          esac

      - name: /readyz aceita tráfego
        run: |
          URL="${{ steps.target.outputs.url }}"
          # /readyz devolve 503 quando uma dependência dura (Postgres/Redis) está fora;
          # -f faz o curl falhar nesse caso, que é exatamente o que queremos aqui.
          curl -fsS --max-time 20 "$URL/readyz"

      - name: Endpoint de análise exige autenticação
        run: |
          URL="${{ steps.target.outputs.url }}"
          # Guardrail de segurança: ALLOW_ANONYMOUS_ANALYSIS deve estar false em produção.
          # Sem token, POST /api/v2/analyze tem que ser recusado (401/403).
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -X POST "$URL/api/v2/analyze" \
            -H 'Content-Type: application/json' \
            -d '{"medication":"dipirona","patient_data":{}}')
          echo "HTTP $CODE"
          if [ "$CODE" != "401" ] && [ "$CODE" != "403" ]; then
            echo "::error::Análise anônima NÃO está bloqueada (HTTP $CODE). Verifique ALLOW_ANONYMOUS_ANALYSIS e ENVIRONMENT=production."
            exit 1
          fi

      - name: Documentação interativa não exposta
        run: |
          URL="${{ steps.target.outputs.url }}"
          # /docs e /redoc só existem quando DEBUG=true — em produção devem dar 404.
          for path in /docs /redoc; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL$path")
            echo "$path -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "::error::$path está exposto — DEBUG provavelmente está true em produção."
              exit 1
            fi
          done
